name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  publish_npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Corrigido para v9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile # <--- MUDANÇA OBRIGATÓRIA

      - name: Run Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Run Tests
        run: pnpm test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: innovare-tech/innv-genesis

      - name: Publish to NPM
        run: pnpm -r publish --filter "./packages/**" --filter "!@innovare-tech/backend-kit" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}