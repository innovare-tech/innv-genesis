name: Publish to NPM

on:
  push:
    tags:
      - 'v*' # Mantém o gatilho por tag

jobs:
  publish_npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm' # Mudar cache para 'pnpm'

      - name: Install Dependencies
        run: pnpm install # Mudar para pnpm install

      - name: Run Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: innovare-tech/innv-genesis # ATUALIZADO: para o slug do monorepo

      - name: Build
        run: pnpm run build

      - name: Publish to NPM
        # Este é o comando-chave:
        # pnpm -r publish: Publica recursivamente
        # --filter "./packages/**": Diz para publicar APENAS o que está na pasta /packages
        run: pnpm -r publish --filter "./packages/**"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}